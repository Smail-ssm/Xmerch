<svg viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Front View -->
  <g id="hoodie-front" transform="translate(0,0)">
    <rect x="10" y="10" width="380" height="580" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">FRONT VIEW</text>
    
    <!-- Hoodie Body -->
    <path d="M 90,100 L 70,120 L 70,400 L 90,420 L 110,420 L 110,520 L 290,520 L 290,420 L 310,420 L 330,400 L 330,120 L 310,100 L 270,100 L 250,140 L 150,140 L 130,100 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Hood -->
    <path d="M 130,100 L 120,70 L 150,50 L 200,45 L 250,50 L 280,70 L 270,100" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Drawstrings -->
    <line x1="170" y1="120" x2="170" y2="160" stroke="#333" stroke-width="1.5"/>
    <line x1="230" y1="120" x2="230" y2="160" stroke="#333" stroke-width="1.5"/>
    
    <!-- Kangaroo Pocket -->
    <path d="M 130,250 Q 200,270 270,250 L 270,330 Q 200,350 130,330 Z" 
          fill="none" stroke="#333" stroke-width="2"/>
    
    <!-- Zipper (half-zip style) -->
    <line x1="200" y1="140" x2="200" y2="220" stroke="#666" stroke-width="3"/>
    
    <!-- Design Area Marker -->
    <rect x="130" y="180" width="140" height="160" fill="none" stroke="#00aaff" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="200" y="270" text-anchor="middle" font-size="10" fill="#00aaff">Design Area</text>
    
    <!-- Ribbed cuffs and hem indicators -->
    <rect x="110" y="500" width="180" height="20" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  </g>

  <!-- Back View -->
  <g id="hoodie-back" transform="translate(400,0)">
    <rect x="10" y="10" width="380" height="580" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">BACK VIEW</text>
    
    <!-- Hoodie Body Back -->
    <path d="M 90,100 L 70,120 L 70,400 L 90,420 L 110,420 L 110,520 L 290,520 L 290,420 L 310,420 L 330,400 L 330,120 L 310,100 L 270,100 L 250,120 L 150,120 L 130,100 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Hood Back -->
    <path d="M 130,100 L 125,75 L 150,55 L 200,50 L 250,55 L 275,75 L 270,100" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Design Area Marker (Back) -->
    <rect x="120" y="180" width="160" height="200" fill="none" stroke="#00aaff" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="200" y="290" text-anchor="middle" font-size="10" fill="#00aaff">Design Area</text>
    
    <!-- Ribbed cuffs and hem -->
    <rect x="110" y="500" width="180" height="20" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  </g>

  <!-- Left Side View -->
  <g id="hoodie-left" transform="translate(800,0)">
    <rect x="10" y="10" width="380" height="580" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">LEFT SIDE VIEW</text>
    
    <!-- Side Profile -->
    <path d="M 140,100 L 130,120 L 130,400 L 140,420 L 150,420 L 150,520 L 250,520 L 250,420 L 260,420 L 270,400 L 270,120 L 260,100 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Hood Side -->
    <path d="M 140,100 L 135,75 L 155,60 L 180,55 L 205,60 L 220,75" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Sleeve -->
    <path d="M 130,120 L 100,140 L 100,280 L 130,300" fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Pocket indication -->
    <ellipse cx="200" cy="280" rx="40" ry="50" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <text x="200" y="350" text-anchor="middle" font-size="10" fill="#666">Side Profile</text>
  </g>

  <!-- Right Side View -->
  <g id="hoodie-right" transform="translate(1200,0)">
    <rect x="10" y="10" width="380" height="580" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">RIGHT SIDE VIEW</text>
    
    <!-- Side Profile (mirrored) -->
    <path d="M 260,100 L 270,120 L 270,400 L 260,420 L 250,420 L 250,520 L 150,520 L 150,420 L 140,420 L 130,400 L 130,120 L 140,100 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Hood Side -->
    <path d="M 260,100 L 265,75 L 245,60 L 220,55 L 195,60 L 180,75" 
          fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Sleeve (mirrored) -->
    <path d="M 270,120 L 300,140 L 300,280 L 270,300" fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Pocket indication -->
    <ellipse cx="200" cy="280" rx="40" ry="50" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <text x="200" y="350" text-anchor="middle" font-size="10" fill="#666">Side Profile</text>
  </g>
</svg>
