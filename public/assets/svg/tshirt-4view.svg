<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Front View -->
  <g id="tshirt-front" transform="translate(0,0)">
    <rect x="10" y="10" width="380" height="480" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">FRONT VIEW</text>
    <!-- Basic T-Shirt Front Shape -->
    <path d="M 100,80 L 80,100 L 80,350 L 100,370 L 120,370 L 120,450 L 280,450 L 280,370 L 300,370 L 320,350 L 320,100 L 300,80 L 250,80 L 230,120 L 170,120 L 150,80 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    <!-- Neck -->
    <ellipse cx="200" cy="95" rx="30" ry="15" fill="white" stroke="#333" stroke-width="2"/>
    <!-- Design Area Marker -->
    <rect x="140" y="150" width="120" height="150" fill="none" stroke="#00aaff" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="200" y="235" text-anchor="middle" font-size="10" fill="#00aaff">Design Area</text>
  </g>

  <!-- Back View -->
  <g id="tshirt-back" transform="translate(400,0)">
    <rect x="10" y="10" width="380" height="480" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">BACK VIEW</text>
    <!-- Basic T-Shirt Back Shape -->
    <path d="M 100,80 L 80,100 L 80,350 L 100,370 L 120,370 L 120,450 L 280,450 L 280,370 L 300,370 L 320,350 L 320,100 L 300,80 L 250,80 L 230,100 L 170,100 L 150,80 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    <!-- Design Area Marker -->
    <rect x="140" y="150" width="120" height="150" fill="none" stroke="#00aaff" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="200" y="235" text-anchor="middle" font-size="10" fill="#00aaff">Design Area</text>
  </g>

  <!-- Left Side View -->
  <g id="tshirt-left" transform="translate(800,0)">
    <rect x="10" y="10" width="380" height="480" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">LEFT SIDE VIEW</text>
    <!-- Side Profile -->
    <path d="M 150,80 L 140,100 L 140,350 L 150,370 L 160,370 L 160,450 L 240,450 L 240,370 L 250,370 L 260,350 L 260,100 L 250,80 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    <!-- Sleeve indication -->
    <path d="M 140,100 L 120,120 L 120,200 L 140,220" fill="none" stroke="#333" stroke-width="2"/>
    <text x="200" y="235" text-anchor="middle" font-size="10" fill="#666">Side Profile</text>
  </g>

  <!-- Right Side View -->
  <g id="tshirt-right" transform="translate(1200,0)">
    <rect x="10" y="10" width="380" height="480" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" fill="#666">RIGHT SIDE VIEW</text>
    <!-- Side Profile (mirrored) -->
    <path d="M 250,80 L 260,100 L 260,350 L 250,370 L 240,370 L 240,450 L 160,450 L 160,370 L 150,370 L 140,350 L 140,100 L 150,80 Z" 
          fill="white" stroke="#333" stroke-width="2"/>
    <!-- Sleeve indication -->
    <path d="M 260,100 L 280,120 L 280,200 L 260,220" fill="none" stroke="#333" stroke-width="2"/>
    <text x="200" y="235" text-anchor="middle" font-size="10" fill="#666">Side Profile</text>
  </g>
</svg>
