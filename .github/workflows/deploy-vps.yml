name: Deploy XMerch To VPS

on:
  push:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

concurrency:
  group: xmerch-vps-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      image_ref: ${{ steps.vars.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/apache/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_ref }}
            ${{ steps.vars.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deployment stack to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          source: "deploy/production,deploy/scripts"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          APP_IMAGE: ${{ needs.build.outputs.image_ref }}
          APP_HTTP_PORT: ${{ secrets.XMERCH_APP_HTTP_PORT }}
          COMPOSE_PROJECT_NAME: ${{ secrets.XMERCH_COMPOSE_PROJECT }}
          DB_DATABASE: ${{ secrets.XMERCH_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.XMERCH_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.XMERCH_DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.XMERCH_DB_ROOT_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script_stop: true
          envs: DEPLOY_PATH,APP_IMAGE,APP_HTTP_PORT,COMPOSE_PROJECT_NAME,DB_DATABASE,DB_USERNAME,DB_PASSWORD,DB_ROOT_PASSWORD,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "VPS_DEPLOY_PATH secret is missing."
              exit 1
            fi

            STACK_DIR="${DEPLOY_PATH}/production"
            mkdir -p "${STACK_DIR}"
            cd "${STACK_DIR}"
            chmod +x "${DEPLOY_PATH}/scripts/"*.sh || true

            cat > .env.production <<'EOF'
            ${{ secrets.XMERCH_ENV_PRODUCTION }}
            EOF

            if [ ! -s .env.production ]; then
              echo "XMERCH_ENV_PRODUCTION secret is missing."
              exit 1
            fi

            APP_HTTP_PORT="${APP_HTTP_PORT:-8088}"
            COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-xmerch}"
            DB_DATABASE="${DB_DATABASE:-xmerch}"
            DB_USERNAME="${DB_USERNAME:-xmerch}"
            DB_PASSWORD="${DB_PASSWORD:-xmerch_change_me}"
            DB_ROOT_PASSWORD="${DB_ROOT_PASSWORD:-xmerch_root_change_me}"

            cat > .stack.env <<EOF
            APP_IMAGE=${APP_IMAGE}
            APP_HTTP_PORT=${APP_HTTP_PORT}
            COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            EOF

            if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi

            docker compose --project-name "${COMPOSE_PROJECT_NAME}" --env-file .stack.env -f docker-compose.yml pull
            docker compose --project-name "${COMPOSE_PROJECT_NAME}" --env-file .stack.env -f docker-compose.yml up -d --remove-orphans

            docker compose --project-name "${COMPOSE_PROJECT_NAME}" --env-file .stack.env -f docker-compose.yml exec -T web php artisan migrate --force
            docker compose --project-name "${COMPOSE_PROJECT_NAME}" --env-file .stack.env -f docker-compose.yml exec -T web php artisan optimize:clear
            docker compose --project-name "${COMPOSE_PROJECT_NAME}" --env-file .stack.env -f docker-compose.yml exec -T web php artisan config:cache
            docker compose --project-name "${COMPOSE_PROJECT_NAME}" --env-file .stack.env -f docker-compose.yml exec -T web php artisan route:cache
            docker compose --project-name "${COMPOSE_PROJECT_NAME}" --env-file .stack.env -f docker-compose.yml exec -T web php artisan view:cache

            docker image prune -f
