<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hoodieGradientSideR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#eaeaea;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="-2" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="hoodie-right" transform="translate(150, 50)">
    <!-- Side View Body (Mirrored) -->
    <path d="M 100,0 
             C 140,10 160,40 180,80
             L 130,120
             L 100,100
             L 100,400
             Q 50,410 0,400
             L 0,100
             Q 10,80 20,80
             L 20,0
             Z" 
          fill="url(#hoodieGradientSideR)" stroke="#dddddd" stroke-width="1.5" filter="url(#dropShadow)"/>

     <!-- Sleeve (Side) -->
    <path d="M 100,0 C 120,30 130,80 130,120 L 100,100" fill="none" stroke="#ccc" stroke-width="1"/>
    
    <!-- Hood Profile -->
    <path d="M 100,0 C 120,-10 140,0 150,30 L 100,30" fill="none" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Bottom Hem -->
    <path d="M 0,400 Q 50,410 100,400 L 100,430 Q 50,440 0,430 Z" fill="#e0e0e0" stroke="#ccc" stroke-width="1"/>
  </g>
</svg>
