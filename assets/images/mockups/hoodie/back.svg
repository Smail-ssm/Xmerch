<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hoodieGradientBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="hoodie-back" transform="translate(100, 50)">
    <!-- Main Body Back -->
    <path d="M 80,0 
             L 220,0 
             C 240,0 260,20 270,40
             L 300,100 
             L 260,120 
             Q 250,100 240,100 
             L 240,400 
             Q 150,410 60,400 
             L 60,100 
             Q 50,100 40,120 
             L 0,100 
             C 10,60 40,20 80,0
             Z" 
          fill="url(#hoodieGradientBack)" stroke="#cccccc" stroke-width="1.5" filter="url(#dropShadow)"/>

     <!-- Hood (Back view, down) -->
    <path d="M 80,0 Q 150,60 220,0" fill="#f1f3f5" stroke="#ccc" stroke-width="1"/>
    
    <!-- Sleeve Cuffs -->
    <path d="M 0,100 L 40,120" fill="none" stroke="#ccc" stroke-width="1"/>
    <path d="M 300,100 L 260,120" fill="none" stroke="#ccc" stroke-width="1"/>

    <!-- Bottom Hem -->
    <path d="M 60,400 Q 150,410 240,400 L 240,430 Q 150,440 60,430 Z" fill="#e9ecef" stroke="#ccc" stroke-width="1"/>
  </g>
</svg>
