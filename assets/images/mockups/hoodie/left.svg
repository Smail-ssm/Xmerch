<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hoodieGradientSideL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eaeaea;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="hoodie-left" transform="translate(150, 50)">
    <!-- Side View Body -->
    <path d="M 80,0 
             C 40,10 20,40 0,80
             L 50,120
             L 80,100
             L 80,400
             Q 130,410 180,400
             L 180,100
             Q 170,80 160,80
             L 160,0
             Z" 
          fill="url(#hoodieGradientSideL)" stroke="#dddddd" stroke-width="1.5" filter="url(#dropShadow)"/>

     <!-- Sleeve (Side) -->
    <path d="M 80,0 C 60,30 50,80 50,120 L 80,100" fill="none" stroke="#ccc" stroke-width="1"/>
    
    <!-- Hood Profile -->
    <path d="M 80,0 C 60,-10 40,0 30,30 L 80,30" fill="none" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Bottom Hem -->
    <path d="M 80,400 Q 130,410 180,400 L 180,430 Q 130,440 80,430 Z" fill="#e0e0e0" stroke="#ccc" stroke-width="1"/>
  </g>
</svg>
