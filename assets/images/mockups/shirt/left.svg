<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shirtGradientSideL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eaeaea;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="shirt-left" transform="translate(150, 50)">
    <!-- Side View Body -->
    <path d="M 100,0 
             L 80,10 
             L 50,60
             L 70,120
             L 100,100
             L 100,450
             Q 130,460 160,450
             L 160,100
             L 160,0
             Z" 
          fill="url(#shirtGradientSideL)" stroke="#dddddd" stroke-width="1.5" filter="url(#dropShadow)"/>
          
    <path d="M 160,0 L 100,0" fill="none" stroke="#ccc" stroke-width="1"/>
  </g>
</svg>
