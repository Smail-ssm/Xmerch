<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shirtGradientFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f3f5;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="shirt-front" transform="translate(100, 50)">
    <!-- Main Body Front -->
    <path d="M 80,0 
             L 220,0 
             L 280,60
             L 260,150 
             L 220,130 
             Q 220,130 220,130 
             L 220,450 
             Q 150,460 80,450 
             L 80,130 
             Q 80,130 80,130 
             L 40,150 
             L 20,60
             L 80,0
             Z" 
          fill="url(#shirtGradientFront)" stroke="#cccccc" stroke-width="1.5" filter="url(#dropShadow)"/>

     <!-- Collar -->
    <path d="M 120,0 L 150,30 L 180,0 L 150,10 Z" fill="#fff" stroke="#ccc" stroke-width="1"/>
    
    <!-- Buttons -->
    <circle cx="150" cy="60" r="3" fill="#ddd" />
    <circle cx="150" cy="110" r="3" fill="#ddd" />
    <circle cx="150" cy="160" r="3" fill="#ddd" />
    <circle cx="150" cy="210" r="3" fill="#ddd" />
    <circle cx="150" cy="260" r="3" fill="#ddd" />
    
    <!-- Placket -->
    <path d="M 140,0 L 160,0 L 160,450 L 140,450 Z" fill="none" stroke="#eee" stroke-width="1"/>

  </g>
</svg>
