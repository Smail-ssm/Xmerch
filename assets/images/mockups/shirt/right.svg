<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shirtGradientSideR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#eaeaea;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="-2" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="shirt-right" transform="translate(150, 50)">
    <!-- Side View Body (Mirrored) -->
    <path d="M 120,0 
             L 140,10 
             L 170,60
             L 150,120
             L 120,100
             L 120,450
             Q 90,460 60,450
             L 60,100
             L 60,0
             Z" 
          fill="url(#shirtGradientSideR)" stroke="#dddddd" stroke-width="1.5" filter="url(#dropShadow)"/>
          
    <path d="M 60,0 L 120,0" fill="none" stroke="#ccc" stroke-width="1"/>
  </g>
</svg>
