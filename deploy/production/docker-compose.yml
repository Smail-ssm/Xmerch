services:
  web:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_HTTP_PORT:-8088}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/project/storage
      - app_uploads:/var/www/html/assets/images
      - app_temp_files:/var/www/html/assets/temp_files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
    networks:
      - internal

  queue:
    image: ${APP_IMAGE}
    restart: unless-stopped
    profiles: ["workers"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/project/storage
      - app_uploads:/var/www/html/assets/images
      - app_temp_files:/var/www/html/assets/temp_files
    networks:
      - internal

  scheduler:
    image: ${APP_IMAGE}
    restart: unless-stopped
    profiles: ["workers"]
    command:
      [
        "sh",
        "-c",
        "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done",
      ]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/project/storage
      - app_uploads:/var/www/html/assets/images
      - app_temp_files:/var/www/html/assets/temp_files
    networks:
      - internal

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-xmerch}
      MARIADB_USER: ${DB_USERNAME:-xmerch}
      MARIADB_PASSWORD: ${DB_PASSWORD:-xmerch_change_me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-xmerch_root_change_me}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  app_storage:
  app_uploads:
  app_temp_files:
  db_data:
  redis_data:

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-xmerch}_internal

